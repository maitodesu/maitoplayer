name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      real_media:
        description: Run the generated FFmpeg/FFprobe compatibility lane
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  rust:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # master 2026-09-04
        with:
          toolchain: 1.96.0
          components: rustfmt,clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: cargo install cargo-audit --locked --version 0.22.2
      - run: cargo audit --file Cargo.lock
      - run: cargo audit --file apps/desktop/src-tauri/Cargo.lock
      - run: cargo install cargo-license --locked --version 0.7.0
      - run: cargo license --json
      - run: cargo license --json --manifest-path apps/desktop/src-tauri/Cargo.toml
      - run: powershell -File tests/contract/verify-contract-boundaries.ps1
      - run: powershell -File tools/ci/check-artifacts.ps1
      - run: powershell -File tools/ci/check-capabilities.ps1
      - run: powershell -File tools/ci/check-secrets.ps1
      - run: powershell -File tests/security/verify-desktop-boundary.ps1

  frontend:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996 # v6
        with:
          version: 11.24.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.14.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm generate:contracts
      - run: git diff --exit-code -- apps/desktop/ui/src/lib/contracts/generated.ts
      - run: pnpm format:check
      - run: pnpm check
      - run: pnpm test
      - run: pnpm build

  desktop:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996 # v6
        with:
          version: 11.24.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.14.0
          cache: pnpm
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # master 2026-09-04
        with:
          toolchain: 1.96.0
          components: rustfmt,clippy
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: cargo fmt --manifest-path apps/desktop/src-tauri/Cargo.toml -- --check
      - run: cargo clippy --manifest-path apps/desktop/src-tauri/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml
      - run: pnpm --dir apps/desktop/ui desktop:debug

  real-media:
    if: github.event_name == 'workflow_dispatch' && inputs.real_media
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # master 2026-09-04
        with:
          toolchain: 1.96.0
      - name: Generate and exercise real media fixtures
        shell: powershell
        run: |
          $ffmpeg = (Get-Command ffmpeg -ErrorAction Stop).Source
          $ffprobe = (Get-Command ffprobe -ErrorAction Stop).Source
          & tools/media-fixtures/generate.ps1 -Ffmpeg $ffmpeg -Ffprobe $ffprobe
          & tools/ci/check-media-checksums.ps1
          & tools/media-fixtures/run-real-tool-tests.ps1 -Ffmpeg $ffmpeg -Ffprobe $ffprobe
